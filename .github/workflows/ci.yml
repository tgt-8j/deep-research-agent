name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff==0.16.10 pytest pytest-asyncio pytest-cov
          python -m pip cache purge
          pip install -e .

      - name: Verify ruff installation
        run: python -m ruff --version

      - name: Lint with Ruff
        run: python -m ruff check src/ tests/ --output-format=concise

      - name: Format check
        run: python -m ruff format --check src/ tests/

      - name: Run tests
        run: pytest tests/ -v --tb=short -p no:cacheprovider -s
        env:
          BOCHA_API_KEY: ${{ secrets.BOCHA_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.12'
